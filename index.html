<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日出到日落</title>

<style>
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    /* 天空 */
    .sky {
        position: relative;
        width: 100%;
        height: 100%;
        animation: skyColor 20s linear infinite;
    }

    /* 地面 */
    .ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 25%;
        background: #2e7d32;
    }

    /* 太阳 */
    .sun {
        position: absolute;
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, #fff176, #fbc02d);
        border-radius: 50%;
        box-shadow: 0 0 40px rgba(255, 200, 0, 0.8);
        animation: sunMove 20s linear infinite;
    }

    /* 太阳运动轨迹 */
    @keyframes sunMove {
        0% {
            left: -10%;
            bottom: 25%;
        }
        25% {
            left: 20%;
            bottom: 55%;
        }
        50% {
            left: 45%;
            bottom: 70%;
        }
        75% {
            left: 70%;
            bottom: 55%;
        }
        100% {
            left: 110%;
            bottom: 25%;
        }
    }

    /* 天空颜色变化 */
    @keyframes skyColor {
        0%   { background: linear-gradient(#1a237e, #ff8a65); } /* 日出 */
        25%  { background: linear-gradient(#64b5f6, #bbdefb); }
        50%  { background: linear-gradient(#42a5f5, #90caf9); } /* 正午 */
        75%  { background: linear-gradient(#ffb74d, #ff7043); }
        100% { background: linear-gradient(#1a237e, #0d133d); } /* 夜晚 */
    }

    /* 标题 */
    .title {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 28px;
        font-weight: bold;
        text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        pointer-events: none;
    }
</style>
</head>

<body>
<div class="sky">
    <div class="title">☀️</div>
    <div class="sun"></div>
    <div class="ground"></div>
</div>
</body>
</html>
